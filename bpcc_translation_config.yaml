model:
  model_name_or_path: "dllm-hub/ModernBERT-base-chat-v0.1"
  dtype: "bfloat16"
  attn_implementation: null
  lora: false

data:
  jsonl_path: "bpcc_hin_deva.jsonl"
  dataset_format: "flat"
  src_field: "src"
  tgt_field: "tgt"
  eval_split: 0.2
  max_length: 512
  mask_prompt_loss: true
  num_proc: 4

training:
  output_dir: ".models/modernbert-chat-bpcc-translation-v2"
  num_train_epochs: 12
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  gradient_accumulation_steps: 1
  bf16: true
  group_by_length: true
  eval_strategy: "epoch"
  save_strategy: "steps"
  save_steps: 1000
  save_total_limit: 5
  logging_steps: 20
  seed: 42
  report_to: "wandb"
  wandb_project: "universal-language-translator"
  # dllm MDLM-specific
  time_epsilon: 1.0e-3
  loss_weight_type: "uniform"
  loss_norm_type: "token"
