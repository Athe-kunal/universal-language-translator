# Fine-tune LLaDA-MoE-7B-A1B-Instruct (native diffusion LM, no BERT->diffusion
# adaptation stage needed) on BPCC English->Hindi pairs.
#
# Run scripts/check_llada_tokenizer.py FIRST — this whole config is only
# worth running if that check passes. See docs/llada-moe-en-hi-finetuning.md.
#
# LLaDAMoEModelLM is registered locally in dllm-src under AutoModelForMaskedLM
# (dllm-src/dllm/pipelines/llada/models/__init__.py), so train_translation.py
# loads and trains it exactly like the mmBERT/ModernBERT configs in this repo
# - no dFactory/VeOmni dependency required.
#
# 7B resident params (1B active/token) mean this does not fit plain DDP.
# Launch with the FSDP2 accelerate config, e.g.:
#   make train CONFIG=configs/llada_moe_bpcc_translation_config.yaml \
#     ACCEL_CFG=dllm-src/scripts/accelerate_configs/fsdp2.yaml GPUS=2 GPU_IDS=0,1
model:
  model_name_or_path: "inclusionAI/LLaDA-MoE-7B-A1B-Instruct"
  dtype: "bfloat16"
  attn_implementation: null
  # Full fine-tune is tight-but-plausible on 2xA100-80GB under FSDP2 with
  # gradient checkpointing (see docs/llada-moe-en-hi-finetuning.md). If it
  # OOMs, flip this to true rather than fighting batch size further - LoRA is
  # already wired generically via dllm.utils.get_model/load_peft.
  lora: false

data:
  jsonl_path: "bpcc_hin_deva.jsonl"
  dataset_format: "flat"
  src_field: "src"
  tgt_field: "tgt"
  eval_split: 0.02
  max_length: 512
  max_token_length: 2048
  mask_prompt_loss: true
  num_proc: 4

training:
  output_dir: ".models/llada-moe-bpcc-translation"
  num_train_epochs: 3
  # Small per-device batch: 7B resident params + FSDP2-sharded optimizer
  # state leaves little headroom for activations. Raise gradient_accumulation
  # instead of per_device_train_batch_size if you need a larger effective
  # batch.
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 1.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  group_by_length: false
  # Fixed diffusion-canvas width (padded with EOS, kept in the loss) so the
  # model is trained to predict EOS/eot across a long trailing span, matching
  # the fixed max_new_tokens canvas the sampler builds at inference. Verify
  # this against scripts/check_llada_tokenizer.py output and adjust if BPCC
  # Hindi chunks tokenize longer/shorter than expected.
  fixed_canvas_length: 128
  eval_strategy: "epoch"
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 5
  logging_steps: 20
  seed: 42
  report_to: "wandb"
  wandb_project: "universal-language-translator"
  # dllm MDLM-specific
  time_epsilon: 1.0e-3
  loss_weight_type: "uniform"
  loss_norm_type: "token"
