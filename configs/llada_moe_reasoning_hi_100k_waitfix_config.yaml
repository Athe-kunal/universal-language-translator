# Overnight run: fine-tune LLaDA-MoE-7B-A1B-Instruct on the FULL curated
# 100k-step "Wait"-normalized reasoning_hi set (vs. the 10k smoke test in
# llada_moe_reasoning_hi_final10k_waitfix_config.yaml). ~10x the data of the
# 10k run, which took ~77min/epoch on 2 GPUs - expect ~11hrs for 1 epoch
# here, hence save_strategy/eval_strategy are step-based (not epoch-based)
# so there are usable intermediate checkpoints if this needs to be
# interrupted rather than only a single save at the very end.
#
# Data prep: .claude-config/.../tmp/prep_100k_waitfix.py - same "Wait"-opener
# normalization as the 10k run, applied to all 100k steps, then a *shuffled*
# 500-doc validation split (unlike the 10k run's adjacent-slice split, which
# biased val toward the lower-similarity tail since reasoning_hi_final_100k
# is itself sorted best-first by curate_top_k.py).
#
# Run:
#   accelerate launch --config_file dllm-src/scripts/accelerate_configs/fsdp2.yaml \
#       --num_processes 2 \
#       train_translation.py --config configs/llada_moe_reasoning_hi_100k_waitfix_config.yaml
extends: _base_chunked_translation.yaml

model:
  model_name_or_path: "inclusionAI/LLaDA-MoE-7B-A1B-Instruct"
  dtype: "bfloat16"
  attn_implementation: null
  lora: false

data:
  jsonl_path: "reasoning_hi_final_100k_train_waitfix.jsonl"
  eval_jsonl_path: "reasoning_hi_final_100k_val_waitfix.jsonl"
  dataset_format: "chunked"
  max_length: 2048
  max_token_length: 2048
  mask_prompt_loss: true
  num_proc: 4
  tasks:
    - name: "reasoning"
      chunks_field: "steps"

training:
  trainer: "mdlm"
  fixed_canvas_length: 0
  output_dir: ".models/llada-moe-reasoning-hi-100k-waitfix"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 1.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  group_by_length: true
  eval_strategy: "steps"
  eval_steps: 1000
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 2
  logging_steps: 10
  seed: 42
  report_to: "all"
  wandb_project: "universal-language-translator"
  time_epsilon: 1.0e-3
  loss_weight_type: "uniform"
  loss_norm_type: "token"
