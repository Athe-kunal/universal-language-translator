# One-epoch smoke test: fine-tune LLaDA-MoE-7B-A1B-Instruct (native diffusion
# LM, MDLM objective - see llada_moe_bpcc_translation_config.yaml, the
# precedent this config otherwise mirrors) on the same "Wait"-normalized 10k
# reasoning_hi data used for the Qwen3-0.6B-a2d-BD3LM comparisons, to see how
# a diffusion model trained from scratch (not AR-adapted) does on this task.
#
# CAUTION: the tokenizer gate-check (see .claude session history -
# scripts/check_llada_tokenizer.py's old logic, run ad hoc since that file
# was removed in an earlier cleanup) came back BORDERLINE: ~22.5
# tokens/sentence for short Hindi text, and the token pieces are literal
# byte-level UTF-8 fragments (e.g. "à¤¯", "à¤¹"), not real Devanagari
# subwords - the same structural risk already diagnosed as the cause of the
# ~17-28% U+FFFD corruption rate on the Qwen3-0.6B-BD3LM checkpoints (see
# project memory / this session's manual review), likely present here too
# since LLaDA-MoE almost certainly saw far less Hindi in pretraining.
#
# 7B resident params (1B active/token) mean this does not fit plain DDP -
# needs FSDP2 to shard optimizer state across GPUs. Run:
#   accelerate launch --config_file dllm-src/scripts/accelerate_configs/fsdp2.yaml \
#       --num_processes 2 \
#       train_translation.py --config configs/llada_moe_reasoning_hi_final10k_waitfix_config.yaml
extends: _base_chunked_translation.yaml

model:
  model_name_or_path: "inclusionAI/LLaDA-MoE-7B-A1B-Instruct"
  dtype: "bfloat16"
  attn_implementation: null
  lora: false

data:
  jsonl_path: "reasoning_hi_final_10k_train_waitfix.jsonl"
  eval_jsonl_path: "reasoning_hi_final_10k_val_waitfix.jsonl"
  dataset_format: "chunked"
  max_length: 2048
  max_token_length: 2048
  mask_prompt_loss: true
  num_proc: 4
  tasks:
    - name: "reasoning"
      chunks_field: "steps"

training:
  trainer: "mdlm"
  # MDLMTrainingArguments defaults this to 128 - sized for BPCC's short
  # sentence pairs, not reasoning_hi's steps which run past 1000 tokens (see
  # qwen3_a2d_mdlm_reasoning_hi_final10k_waitfix_config.yaml - the same
  # truncation bug, disabled there for the same reason). Falls back to
  # ordinary dynamic batch-max padding, paired with group_by_length below.
  fixed_canvas_length: 0
  output_dir: ".models/llada-moe-reasoning-hi-final10k-waitfix"
  num_train_epochs: 1
  # Small per-device batch: 7B resident params + FSDP2-sharded optimizer
  # state leaves little headroom for activations - same tradeoff as
  # llada_moe_bpcc_translation_config.yaml. Raise gradient_accumulation
  # instead of per_device_train_batch_size if a larger effective batch is
  # needed.
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 1.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  bf16: true
  group_by_length: true
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 2
  logging_steps: 10
  seed: 42
  report_to: "all"
  wandb_project: "universal-language-translator"
  time_epsilon: 1.0e-3
  loss_weight_type: "uniform"
  loss_norm_type: "token"
