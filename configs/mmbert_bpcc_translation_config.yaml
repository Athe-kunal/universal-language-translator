extends: _base_bpcc.yaml

model:
  # Run `make adapt-mmbert` first to produce this checkpoint (BERT->diffusion
  # continual-pretraining adaptation, mirroring the recipe that produced
  # dllm-hub/ModernBERT-base-chat-v0.1). Fine-tuning raw jhu-clsp/mmBERT-base
  # directly on BPCC skips that adaptation: mmBERT's decay phase only used a
  # 5% mask rate, so denoising from 100% masked at generation time is far
  # outside its training distribution and collapses into repetition.
  model_name_or_path: ".models/mmbert-diffusion-adapted/checkpoint-final"
  dtype: "bfloat16"
  attn_implementation: null
  lora: false

training:
  output_dir: ".models/mmbert-bpcc-translation-10epoch"
  num_train_epochs: 10
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  learning_rate: 3.0e-5
  # Step-based saves for this diagnostic run: epoch-only checkpoints can
  # skip past an early collapse with nothing pre-collapse to inspect.
  save_steps: 200
  report_to: "none"
