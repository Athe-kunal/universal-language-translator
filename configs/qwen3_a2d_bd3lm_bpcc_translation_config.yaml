extends: _base_bpcc_bd3lm.yaml

# BD3LM (block diffusion) counterpart to qwen3_a2d_bpcc_translation_config.yaml
# - same base checkpoint family, dataset, and hyperparams, but SFT'd with the
# block-diffusion objective/trainer instead of full-canvas MDLM, for a direct
# MDLM-vs-BD3LM comparison on BPCC. See train_translation.py's --trainer
# selection (BD3LMTrainer + AppendEOSBlockWrapper collator) and
# dllm-src/examples/a2d/README.md for background on the two objectives.
model:
  model_name_or_path: "dllm-hub/Qwen3-0.6B-diffusion-bd3lm-v0.1"
  dtype: "bfloat16"
  attn_implementation: null
  lora: false

training:
  output_dir: ".models/qwen3-a2d-bd3lm-bpcc-translation"
  num_train_epochs: 2
  per_device_train_batch_size: 32
  per_device_eval_batch_size: 64
  learning_rate: 3.0e-5
  report_to: "all"
