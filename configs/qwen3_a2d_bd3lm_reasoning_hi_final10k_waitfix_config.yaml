# Same as qwen3_a2d_bd3lm_reasoning_hi_final10k_config.yaml, but trained on
# reasoning_hi_final_10k_{train,val}_waitfix.jsonl - the same 10k-step slice
# with "Wait"-initial steps' Hindi openers normalized to a single canonical
# form (see .claude-config/jobs/9a397111/tmp/normalize_wait.py) instead of
# the 1,803 distinct (many outright wrong) openers the raw Fireworks output
# had. Tests whether that multimodal-target hypothesis is actually why the
# un-fixed checkpoint collapsed into repetition loops on "Wait"-heavy inputs.
#
# Run:
#   make train CONFIG=configs/qwen3_a2d_bd3lm_reasoning_hi_final10k_waitfix_config.yaml GPUS=1 GPU_IDS=1
extends: _base_chunked_translation.yaml

model:
  model_name_or_path: "dllm-hub/Qwen3-0.6B-diffusion-bd3lm-v0.1"
  dtype: "bfloat16"
  attn_implementation: null
  lora: false

data:
  jsonl_path: "reasoning_hi_final_10k_train_waitfix.jsonl"
  eval_jsonl_path: "reasoning_hi_final_10k_val_waitfix.jsonl"
  dataset_format: "chunked"
  max_length: 2048
  max_token_length: 2048
  mask_prompt_loss: true
  num_proc: 4
  tasks:
    - name: "reasoning"
      chunks_field: "steps"

training:
  trainer: "bd3lm"
  block_size: 32
  output_dir: ".models/qwen3-a2d-bd3lm-reasoning-hi-final10k-waitfix"
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  per_device_eval_batch_size: 8
  learning_rate: 3.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  group_by_length: true
  eval_strategy: "epoch"
  save_strategy: "epoch"
  save_total_limit: 3
  logging_steps: 10
  seed: 42
  report_to: "all"
  wandb_project: "universal-language-translator"
  time_epsilon: 1.0e-3
  loss_weight_type: "uniform"
  loss_norm_type: "token"
