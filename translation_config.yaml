model:
  model_name_or_path: "answerdotai/ModernBERT-base"
  dtype: "bfloat16"
  attn_implementation: null
  lora: false

data:
  jsonl_path: "translation_cache.jsonl"
  max_length: 512
  mask_prompt_loss: true
  num_proc: 4
  tasks:
    - name: "question"
      source_field: "problem"
      target_field: "problem_hi"
    - name: "solution"
      source_field: "solution"
      target_field: "solution_hi"

training:
  output_dir: ".models/modernbert-translation"
  num_train_epochs: 3
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  learning_rate: 1.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  gradient_accumulation_steps: 1
  bf16: true
  group_by_length: true
  eval_strategy: "epoch"
  save_strategy: "epoch"
  logging_steps: 10
  seed: 42
  report_to: "wandb"
  wandb_project: "universal-language-translator"
  # dllm MDLM-specific
  time_epsilon: 1.0e-3
  loss_weight_type: "scheduler"
  loss_norm_type: "token"
